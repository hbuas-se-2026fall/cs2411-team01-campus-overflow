# CampusOverflow 持续集成流水线（对应 arc42 第 10 章适应度函数与第 7 章部署视图）
name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # 阶段 1：编译（模块依赖不成环由 Maven 保证）
      - name: 编译
        working-directory: backend
        run: mvn -B clean compile

      # 阶段 2：单元测试（领域层 + 应用层，毫秒级，无外部依赖）
      - name: 单元测试
        working-directory: backend
        run: mvn -B test

      # 阶段 3：架构适应度函数（ArchUnit：FF-1~FF-6）。-am 让上游模块一起进入反应堆，否则依赖无法解析
      - name: 架构约束检查
        working-directory: backend
        run: mvn -B test -pl co-bootstrap -am -Dtest=ArchitectureTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false

      # 阶段 4：领域层覆盖率门禁（低于阈值直接失败）
      - name: 覆盖率门禁
        working-directory: backend
        run: mvn -B verify -DskipITs -Djacoco.skip=false

      # 阶段 5：集成测试（Testcontainers 拉起真实 MySQL + Redis）
      # 运行器上的 Docker Engine 29 把最小 API 提到 1.44，而 Testcontainers 1.20 客户端固定发 1.32，
      # 因此先把 daemon 的最小版本放宽到 1.32，避免 “client version 1.32 is too old”。
      - name: 放宽 Docker 最小 API 版本
        run: |
          echo '{"min-api-version":"1.32"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 5
          docker version
      - name: 集成测试
        working-directory: backend
        run: mvn -B verify -Dsurefire.skip=true

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/target/*-reports/*.xml"

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck
      - name: 代码规范检查
        working-directory: frontend
        run: npm run lint
      - name: 构建
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: 构建后端镜像
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .
      - name: 构建前端镜像
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .
