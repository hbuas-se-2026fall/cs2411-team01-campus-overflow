# CampusOverflow 告警规则（对应 Lab8 Step5：至少 1 条告警）
# 指标口径见 deploy/prometheus.yml 注释；HTTP 指标由 Micrometer /actuator/prometheus 暴露。
groups:
  - name: campus-overflow
    rules:
      - alert: OutboxDeadLetter
        expr: increase(co_outbox_dead_letters[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "发件箱出现死信事件"
          description: "近 5 分钟新增死信 {{ $value }} 条，需人工排查事件投递链路。"

      - alert: OutboxBacklogHigh
        expr: co_outbox_backlog > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "发件箱积压超过 100"
          description: "当前积压 {{ $value }} 条，持续 5 分钟以上，检查消费者是否阻塞。"

      - alert: ReputationMismatch
        expr: co_reputation_mismatches > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "声誉账本对账不一致"
          description: "存在 {{ $value }} 个账户声誉对账不一致（FF-8，正常应为 0）。"

      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx 错误率超过 1%"
          description: "近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}。"

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 P95 延迟超过 500ms"
          description: "全局 P95 延迟 {{ $value | humanizeDuration }}，持续 5 分钟以上。"
